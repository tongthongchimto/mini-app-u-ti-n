<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewards</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #101318;
      color: white;
      padding: 20px;
    }

    .app {
      max-width: 430px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .user {
      background: #1c222b;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .balance {
      background: linear-gradient(135deg, #242b38, #171c24);
      border-radius: 22px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .balance-title {
      color: #9da6b5;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .points {
      font-size: 42px;
      font-weight: bold;
    }

    .coin {
      font-size: 30px;
    }

    .reward-btn {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2aabee;
      color: white;
    }

    .reward-btn:active {
      transform: scale(.98);
    }

    .section-title {
      margin: 25px 0 12px;
      font-size: 18px;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a2029;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .task-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-icon {
      font-size: 25px;
    }

    .task-name {
      font-size: 14px;
    }

    .task-reward {
      color: #58d68d;
      font-size: 13px;
    }

    .small-btn {
      border: none;
      background: #2aabee;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 25px;
    }

    .nav button {
      border: none;
      background: #1a2029;
      color: white;
      padding: 14px 5px;
      border-radius: 13px;
      cursor: pointer;
    }

    .message {
      text-align: center;
      color: #9da6b5;
      font-size: 13px;
      margin-top: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🪙 Rewards</div>
    <div class="user" id="username">User</div>
  </div>

  <div class="balance">
    <div class="balance-title">Số dư của bạn</div>

    <div>
      <span class="points" id="points">1,250</span>
      <span class="coin">🪙</span>
    </div>

    <button class="reward-btn" onclick="watchAd()">
      ▶️ Xem quảng cáo +10
    </button>
  </div>

  <div class="section-title">Nhiệm vụ</div>

  <div class="task">
    <div class="task-info">
      <div class="task-icon">📢</div>
      <div>
        <div class="task-name">Theo dõi kênh</div>
        <div class="task-reward">+100 🪙</div>
      </div>
    </div>

    <button class="small-btn" onclick="completeTask(100)">
      Nhận
    </button>
  </div>

  <div class="task">
    <div class="task-info">
      <div class="task-icon">👥</div>
      <div>
        <div class="task-name">Mời bạn bè</div>
        <div class="task-reward">+500 🪙</div>
      </div>
    </div>

    <button class="small-btn" onclick="completeTask(500)">
      Mời
    </button>
  </div>

  <div class="task">
    <div class="task-info">
      <div class="task-icon">🎁</div>
      <div>
        <div class="task-name">Điểm danh hôm nay</div>
        <div class="task-reward">+50 🪙</div>
      </div>
    </div>

    <button class="small-btn" onclick="completeTask(50)">
      Nhận
    </button>
  </div>

  <div class="message" id="message"></div>

  <div class="nav">
    <button>🏠<br>Trang chủ</button>
    <button>🎯<br>Nhiệm vụ</button>
    <button>👤<br>Tài khoản</button>
  </div>

</div>

<script>
  let points = 1250;

  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const user = Telegram.WebApp.initDataUnsafe?.user;

    if (user) {
      document.getElementById("username").textContent =
        user.first_name || "User";
    }
  }

  function updatePoints() {
    document.getElementById("points").textContent =
      points.toLocaleString("en-US");
  }

  function watchAd() {
    showMessage("Demo: chỗ này sẽ mở quảng cáo.");
  }

  function completeTask(reward) {
    points += reward;
    updatePoints();

    showMessage("Đã nhận +" + reward + " 🪙");
  }

  function showMessage(text) {
    const message = document.getElementById("message");
    message.textContent = text;

    setTimeout(() => {
      message.textContent = "";
    }, 2500);
  }

  updatePoints();
</script>

</body>
</html>
